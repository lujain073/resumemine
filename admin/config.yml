- name: projects
  label: Projects (English)
  label_singular: Project
  folder: content/projects
  create: true
  extension: json
  format: json
  slug: '{{slug}}'
  identifier_field: title
  summary: '{{order}}. {{title}} — {{status}} — on website: {{published}}'
  sortable_fields:
  - order
  - title
  - published
  fields:
  - name: published
    label: Show on website (turn ON, then press Publish at the top)
    widget: boolean
    default: false
    required: false
    hint: OFF = hidden draft, visible only here in the admin panel. ON = the project, its page and its prototype (if any) appear on the website after you press Publish.
  - &id001
    name: title
    label: Project title
    widget: string
  - name: slug
    label: URL name (lowercase-with-hyphens)
    widget: string
  - name: order
    label: Display order
    widget: number
    value_type: int
  - name: field
    label: Field of pharmacy
    widget: select
    options:
    - label: 1 Research & development
      value: rd
    - label: 2 Manufacturing & engineering
      value: manufacturing
    - label: 3 Quality assurance & quality control
      value: quality
    - label: 4 Regulatory affairs
      value: regulatory
    - label: 5 Supply chain, procurement & distribution
      value: supply
    - label: 6 Medical affairs, marketing & sales
      value: commercial
    - label: 7 Hospital & clinical pharmacy
      value: hospital
    - label: 8 Community pharmacy & patient care
      value: community
    - label: 9 Pharmacovigilance & drug safety
      value: safety
  - &id002
    name: area
    label: Area
    widget: string
  - &id003
    name: short
    label: One-line summary
    widget: text
  - name: status
    label: Status
    widget: select
    options:
    - Conceptual
    - Working prototype
    - Working product
  - name: phase
    label: Pipeline phase
    widget: select
    options:
    - label: 1 Problem discovery
      value: 1
    - label: 2 Concept design
      value: 2
    - label: 3 Prototype
      value: 3
    - label: 4 Validation
      value: 4
    - label: 5 Deployment
      value: 5
  - &id004
    name: symptom
    label: 'Counter: the symptom (short, how a pharmacist would say it)'
    widget: string
  - &id005
    name: ingredient
    label: 'Counter: what is dispensed (the AI solution in one line)'
    widget: string
  - &id006
    name: directions
    label: 'Counter: directions (one or two short sentences)'
    widget: text
  - &id007
    name: problem
    label: Problem
    widget: text
  - &id008
    name: why
    label: Why it matters
    widget: text
  - &id009
    name: solution
    label: Proposed AI solution
    widget: text
  - &id010
    name: technology
    label: Technology involved
    widget: list
  - name: techTags
    label: Technology filters
    widget: select
    multiple: true
    options:
    - label: Language models
      value: llm
    - label: Retrieval from approved sources
      value: rag
    - label: Machine learning
      value: ml
    - label: Statistics & forecasting
      value: stats
    - label: Optimization
      value: opt
    - label: Computer vision
      value: cv
    - label: Rules engines
      value: rules
    - label: AI agents
      value: agent
  - &id011
    name: impact
    label: Expected impact
    widget: list
  - &id012
    name: architecture
    label: How the system works (3–6 steps, in order)
    widget: list
  - name: data
    label: Required data
    widget: list
  - &id013
    name: limitations
    label: Limitations & risks
    widget: list
  - name: review
    label: Human review & approval
    widget: list
  - name: references
    label: Research references
    widget: list
    required: false
    fields:
    - name: title
      label: Title
      widget: string
    - name: url
      label: Link
      widget: string
  - name: screenshots
    label: Screenshots
    widget: list
    required: false
    fields:
    - name: image
      label: Image
      widget: image
    - name: caption
      label: Caption
      widget: string
      required: false
  - name: demo
    label: Live prototype link (e.g. inventory-agent/)
    widget: string
    required: false
  - name: video
    label: Demo video link (YouTube, Loom…)
    widget: string
    required: false
  - name: seoTitle
    label: SEO title (leave empty for automatic)
    widget: string
    required: false
  - name: seoDescription
    label: SEO description (leave empty for automatic)
    widget: text
    required: false
  view_filters:
  - label: Shown on website
    field: published
    pattern: true
  - label: Hidden drafts
    field: published
    pattern: false
- name: faq
  label: FAQ (English)
  editor:
    preview: false
  files:
  - name: faq_en
    label: Frequently asked questions
    file: content/faq.json
    format: json
    fields:
    - name: items
      label: Questions
      widget: list
      fields:
      - name: q
        label: Question
        widget: string
      - name: a
        label: Answer
        widget: text
- name: marketing
  label: AI Marketing (English)
  editor:
    preview: false
  files:
  - name: marketing_en
    label: Audiences, builder, workflow & rules
    file: content/marketing.json
    format: json
    fields:
    - name: audiences
      label: Audiences
      widget: list
      fields:
      - {name: k, label: Key (do not change), widget: select, options: [companies, pharmacies, warehouses, individuals, products]}
      - {name: t, label: Title, widget: string}
      - {name: who, label: Who exactly, widget: string}
      - {name: pain, label: Their challenge, widget: text}
      - {name: make, label: What I make, widget: list}
      - {name: channels, label: Channels, widget: list}
      - {name: compliance, label: Compliance note, widget: text}
    - name: goals
      label: Campaign goals (builder)
      widget: list
      fields:
      - {name: k, label: Key (do not change), widget: string}
      - {name: t, label: Title, widget: string}
      - {name: angle, label: Message angle, widget: string}
      - {name: kpi, label: How to measure, widget: string}
    - name: process
      label: Workflow steps
      widget: list
      fields:
      - {name: t, label: Title, widget: string}
      - {name: d, label: Description, widget: text}
    - name: rules
      label: Compliance rules
      widget: list
      fields:
      - {name: t, label: Title, widget: string}
      - {name: d, label: Description, widget: text}
    - name: references
      label: Sources
      widget: list
      fields:
      - {name: title, label: Title, widget: string}
      - {name: url, label: URL, widget: string}
    - {name: note, label: Disclaimer under the rules, widget: text}
- name: articles
  label: Articles (English)
  label_singular: Article
  folder: content/articles
  create: true
  extension: json
  format: json
  slug: '{{slug}}'
  identifier_field: title
  fields:
  - name: title
