# Admin panel (Decap CMS). Open https://your-domain.com/admin/
# Every save commits to GitHub; Netlify rebuilds the site in about a minute.
# English content: content/*  ·  Arabic content: content/ar/*
backend:
  name: git-gateway
  branch: main
local_backend: true
media_folder: static/img/uploads
public_folder: img/uploads
site_url: https://your-domain.com
display_url: https://your-domain.com
logo_url: /favicon.svg
collections:
- name: settings
  label: Site settings (English)
  editor:
    preview: false
  files:
  - name: site
    label: Profile, pages & SEO
    file: content/site.json
    format: json
    fields:
    - name: publish
      label: Publish sections (turn ON, then press Publish at the top)
      widget: object
      fields:
      - name: fields
        label: Show the 9 pharmaceutical fields (Field guide page, map and menu link)
        widget: boolean
        default: false
        required: false
    - name: siteUrl
      label: Website address (no slash at the end)
      widget: string
    - name: name
      label: Short name
      widget: string
    - name: fullName
      label: Full name (shown in header, titles & Google)
      widget: string
    - name: arabicName
      label: Name in Arabic
      widget: string
    - name: role
      label: Professional title
      widget: string
    - name: positioning
      label: Positioning line
      widget: string
    - name: location
      label: Location
      widget: string
    - name: brandConcept
      label: Brand concept
      widget: string
    - name: tagline
      label: Main tagline
      widget: string
    - name: theme
      label: Brand colours (hex codes)
      widget: object
      fields:
      - name: navy
        label: Main dark colour
        widget: string
      - name: teal
        label: Accent colour
        widget: string
      - name: sand
        label: Warm colour
        widget: string
    - name: seo
      label: SEO — title & description for each page
      widget: object
      collapsed: true
      fields:
      - name: home
        label: Home
        widget: object
        fields:
        - name: title
          label: Meta title (50–60 characters)
          widget: string
        - name: description
          label: Meta description (140–160 characters)
          widget: text
      - name: about
